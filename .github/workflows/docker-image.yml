name: Docker Image CI

on:
  push:
    branches: [ "main", "unifi" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        # the image runs Debian trixie's nodejs 20
        node-version: 20
        cache: npm

    - run: npm ci

    - run: npm test

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Read version
      id: meta
      run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

    # main publishes latest, the version and the commit; the unifi branch
    # (UniFi console page) publishes only its own tag and leaves latest alone
    - name: Image tags
      id: tags
      env:
        VERSION: ${{ steps.meta.outputs.version }}
      run: |
        if [ "$GITHUB_REF_NAME" = "unifi" ]; then
          echo "list=renedis/powertop:unifi" >> "$GITHUB_OUTPUT"
        else
          echo "list=renedis/powertop:latest,renedis/powertop:${VERSION},renedis/powertop:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.tags.outputs.list }}
