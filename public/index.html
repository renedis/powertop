<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#181c1f">
<title>PowerTop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230c1311'/%3E%3Cpath d='M2 11h3l2-6 2 8 2-5h3' fill='none' stroke='%23f5b83d' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/barlow-semi-condensed-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/uplot/uPlot.min.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <header class="bar" id="bar">
    <div class="bar-host">
      <label class="visually-hidden" for="host-select">Host</label>
      <select id="host-select" class="host-select"></select>
      <dl class="facts" id="facts"></dl>
    </div>
    <div class="bar-acq" id="acq" aria-live="polite"></div>
    <div class="bar-controls">
      <div class="seg" id="mode" role="radiogroup" aria-label="Measurement mode"></div>
      <button class="btn btn-primary" id="measure" type="button">Measure now</button>
    </div>
  </header>
  <section class="readouts" id="readouts" aria-label="Current readings"></section>
  <nav class="side" id="nav" aria-label="Views"></nav>
  <main class="view" id="view" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/vendor/uplot/uPlot.iife.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
